name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Manifest valideren en bundel bouwen
        run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: zonneplan-mcpb
          path: zonneplan.mcpb
          retention-days: 14
